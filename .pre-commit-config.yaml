# Local hooks; run `npm ci` first (the eslint hook runs against
# node_modules). Ordinary clone: run `npm run setup` once (see
# CONTRIBUTING.md). `git config prek.enabled true` only does anything on a
# machine that routes Git hooks through a global core.hooksPath dispatcher
# (a maintainer convention, not the norm) -- it is not a substitute for
# `npm run setup` on a plain clone.
#
# No top-level `exclude`: that would apply to every hook below, including
# gitleaks and check-added-large-files, which must see the whole tree.
# dist/ is excluded per hook instead, only on the hooks that would
# otherwise rewrite or reject it (it is gitignored and not present in a
# normal checkout, but a local build can leave it on disk).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: "^dist/"
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: "^dist/"
        stages: [pre-commit]

  # `language: system` so this hook runs the repo's own pinned eslint +
  # plugin set straight out of node_modules. A portable mirror would need
  # typescript-eslint re-declared as additional_dependencies and would
  # drift from the version pinned in package.json; system reuses the
  # `npm ci` the CI job already runs.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: node_modules/.bin/eslint --fix
        language: system
        types_or: [javascript, ts, tsx]
        exclude: "^dist/"
        stages: [pre-commit]

  # Portable mirror, not language: node against the repo's own prettier:
  # the fork tracks upstream releases (the official mirror stalled at
  # v3.1.0), pinned to the exact resolved devDependency version (see
  # package-lock.json) so a local `--write` and the hook never disagree.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        exclude: "^dist/"
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]
        stages: [pre-commit]

  # tsc and vitest are too slow for pre-commit; run at push time instead.
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: npm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: vitest
        name: vitest
        entry: npm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
