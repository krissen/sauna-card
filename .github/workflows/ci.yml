name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # eslint runs as a prek hook against this node_modules (language:
      # system), so it must exist before prek runs below.
      - name: Cache prek hook environments
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/prek
          key: prek-${{ runner.os }}-node22-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Quality gates (prek)
        env:
          PREK_HOME: ${{ runner.temp }}/prek
        run: pipx run --spec prek==0.5.2 prek run --all-files --show-diff-on-failure

      # The gitleaks pre-commit hook above only scans the *staged* diff,
      # which is empty in CI (no `git add` happens here) and would
      # otherwise silently report zero findings. Scan the full tree here
      # instead.
      - name: Scan whole tree for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

# HACS plugin validation is enforced in release.yml, where the published release
# asset exists for hacs/action to discover. Running it here would always fail
# pre-release (dist/ is gitignored and we do not commit build artifacts), so it
# is deliberately not part of the per-push CI. The repository is kept
# HACS-compliant (hacs.json, topics, README, MIT) from the start.
