name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build, attach bundle and validate HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # eslint runs as a prek hook against this node_modules (language:
      # system), so it must exist before prek runs below.
      - name: Cache prek hook environments
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/prek
          key: prek-${{ runner.os }}-node22-${{ hashFiles('.pre-commit-config.yaml') }}

      # Re-run the same quality gates as CI so a release can never ship a broken
      # bundle, even if cut from a commit that bypassed CI.
      - name: Quality gates (prek)
        env:
          PREK_HOME: ${{ runner.temp }}/prek
        run: pipx run --spec prek==0.5.2 prek run --all-files --show-diff-on-failure

      # The gitleaks pre-commit hook above only scans the *staged* diff,
      # which is empty here (no `git add` happens in this job) and would
      # otherwise silently report zero findings -- exactly the gap this
      # release gate exists to close for a commit that bypassed CI. Scan
      # the full tree here too, same as ci.yml.
      - name: Scan whole tree for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Quality gates (typecheck + test)
        run: |
          npm run typecheck
          npm run test
      - name: Build the bundle
        run: |
          npm run update-version
          npm run build
      - name: Upload dist/sauna-card.js
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/sauna-card.js
          asset_name: sauna-card.js
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
      # Enforce HACS plugin compliance now that the release asset exists. A
      # broken hacs.json or repository layout fails the release. The action ref
      # is pinned to a SHA, but note hacs/action runs the
      # ghcr.io/hacs/action:main container by its own design, so the validator
      # always uses the current HACS ruleset — which is what we want for a
      # release-time compliance gate (catch new HACS requirements at release).
      - name: Validate HACS manifest & structure
        uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485 # pinned ref; image is :main by design
        with:
          category: "plugin"
